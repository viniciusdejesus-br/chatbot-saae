services:
  postgres:
    image: postgres:16
    container_name: saae-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: saae
      POSTGRES_USER: saae
      POSTGRES_PASSWORD: saae
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
